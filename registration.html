<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Student Registration Form</title>
  <style>
    :root{--bg:#f5f7fb;--card:#fff;--accent:#2b7cff;--muted:#6b7280}
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,"Helvetica Neue",Arial;background:var(--bg);margin:0;padding:32px;display:flex;justify-content:center}
    .card{background:var(--card);max-width:820px;width:100%;padding:24px;border-radius:10px;box-shadow:0 6px 24px rgba(20,30,60,.08)}
    h1{margin:0 0 12px;font-size:1.4rem}
    form{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
    fieldset{grid-column:1/-1;border:1px solid #e6e9ee;padding:12px;border-radius:8px}
    label{display:block;font-size:.9rem;color:var(--muted);margin-bottom:6px}
    input[type="text"],input[type="email"],input[type="password"],input[type="tel"],input[type="date"],select,textarea{
      width:100%;padding:10px;border:1px solid #d8dbe3;border-radius:6px;font-size:1rem;box-sizing:border-box
    }
    textarea{min-height:80px;resize:vertical}
    .small{font-size:.9rem;color:var(--muted)}
    .full{grid-column:1/-1}
    .actions{display:flex;gap:8px;justify-content:flex-end;grid-column:1/-1;margin-top:6px}
    button{padding:10px 14px;border-radius:8px;border:0;background:var(--accent);color:#fff;cursor:pointer}
    button.reset{background:#e6e9ee;color:#111}
    .photo-preview{display:flex;gap:12px;align-items:center}
    .photo-preview img{width:72px;height:72px;object-fit:cover;border-radius:8px;border:1px solid #e6e9ee}
    .error{color:#b00020;font-size:.9rem;margin-top:6px}
    @media (max-width:700px){form{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main class="card" role="main">
    <h1>Student Registration Form</h1>

    <form id="regForm" novalidate>
      <div>
        <label for="firstName">First name <span class="small" aria-hidden="true">*</span></label>
        <input id="firstName" name="firstName" type="text" required placeholder="John" />
      </div>

      <div>
        <label for="lastName">Last name <span class="small" aria-hidden="true">*</span></label>
        <input id="lastName" name="lastName" type="text" required placeholder="Doe" />
      </div>

      <div>
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" placeholder="student@example.com" required />
      </div>

      <div>
        <label for="phone">Phone</label>
        <input id="phone" name="phone" type="tel" placeholder="+1-555-555-5555" pattern="^\+?[0-9\s\-()]{7,20}$" />
      </div>

      <div>
        <label for="dob">Date of birth</label>
        <input id="dob" name="dob" type="date" />
      </div>

      <div>
        <label for="gender">Gender</label>
        <select id="gender" name="gender" aria-label="Gender">
          <option value="">Select...</option>
          <option>Female</option>
          <option>Male</option>
          <option>Non-binary</option>
          <option>Prefer not to say</option>
        </select>
      </div>

      <div>
        <label for="roll">Roll / Student ID</label>
        <input id="roll" name="roll" type="text" placeholder="S123456" />
      </div>

      <div>
        <label for="course">Course / Program</label>
        <select id="course" name="course">
          <option value="">Select program</option>
          <option>B.Sc. Computer Science</option>
          <option>B.A. English</option>
          <option>B.Com</option>
          <option>Diploma</option>
        </select>
      </div>

      <div>
        <label for="year">Year / Semester</label>
        <input id="year" name="year" type="text" placeholder="e.g., 2nd Year / Semester 3" />
      </div>

      <fieldset>
        <legend>Account (optional)</legend>
        <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:12px">
          <div>
            <label for="password">Password</label>
            <input id="password" name="password" type="password" minlength="6" placeholder="Create password" />
          </div>

          <div>
            <label for="confirmPassword">Confirm password</label>
            <input id="confirmPassword" name="confirmPassword" type="password" minlength="6" placeholder="Confirm password" />
          </div>
        </div>
        <p class="small">If you set a password you'll be able to log in later. Passwords must be at least 6 characters.</p>
        <p id="pwError" class="error" aria-live="polite" style="display:none"></p>
      </fieldset>

      <div class="full">
        <label for="address">Address</label>
        <textarea id="address" name="address" placeholder="Street, City, State, ZIP"></textarea>
      </div>

      <div>
        <label for="guardian">Guardian / Parent name</label>
        <input id="guardian" name="guardian" type="text" placeholder="Parent or guardian name" />
      </div>

      <div>
        <label for="photo">Upload photo</label>
        <input id="photo" name="photo" type="file" accept="image/*" />
        <div class="photo-preview" style="margin-top:8px">
          <img id="photoPreview" alt="Photo preview" src="" style="display:none" />
          <span class="small" id="photoInfo">No file chosen</span>
        </div>
      </div>

      <div class="full">
        <label>Interests / Activities</label>
        <div style="display:flex;gap:12px;flex-wrap:wrap">
          <label><input type="checkbox" name="interests" value="sports" /> Sports</label>
          <label><input type="checkbox" name="interests" value="music" /> Music</label>
          <label><input type="checkbox" name="interests" value="arts" /> Arts</label>
          <label><input type="checkbox" name="interests" value="science" /> Science Club</label>
        </div>
      </div>

      <div class="actions">
        <button type="reset" class="reset">Reset</button>
        <button type="submit">Register</button>
      </div>

      <p class="small full" style="margin-top:6px">All fields marked with * are required. This form is a demo — data is not submitted to a server.</p>
    </form>
  </main>

  <script>
    // Basic client-side behaviors: image preview and password match check
    const form = document.getElementById('regForm');
    const photo = document.getElementById('photo');
    const photoPreview = document.getElementById('photoPreview');
    const photoInfo = document.getElementById('photoInfo');
    const pw = document.getElementById('password');
    const pwConfirm = document.getElementById('confirmPassword');
    const pwError = document.getElementById('pwError');

    photo.addEventListener('change', () => {
      const file = photo.files[0];
      if (!file) {
        photoPreview.style.display = 'none';
        photoPreview.src = '';
        photoInfo.textContent = 'No file chosen';
        return;
      }
      if (!file.type.startsWith('image/')) {
        photoInfo.textContent = 'Please choose an image file';
        photoPreview.style.display = 'none';
        return;
      }
      photoInfo.textContent = file.name;
      const reader = new FileReader();
      reader.onload = (e) => {
        photoPreview.src = e.target.result;
        photoPreview.style.display = 'block';
      };
      reader.readAsDataURL(file);
    });

    form.addEventListener('submit', (e) => {
      // Reset error
      pwError.style.display = 'none';
      pwError.textContent = '';

      // Use HTML5 validation first
      if (!form.checkValidity()) {
        // Let browser show native UI for invalid fields
        return;
      }

      // If either password field is filled, ensure they match and meet minlength
      if (pw.value || pwConfirm.value) {
        if (pw.value.length < 6) {
          e.preventDefault();
          pwError.style.display = 'block';
          pwError.textContent = 'Password must be at least 6 characters.';
          pw.focus();
          return;
        }
        if (pw.value !== pwConfirm.value) {
          e.preventDefault();
          pwError.style.display = 'block';
          pwError.textContent = 'Passwords do not match.';
          pwConfirm.focus();
          return;
        }
      }

      // Demo form: prevent actual submission and show a confirmation message
      e.preventDefault();
      alert('Registration submitted (demo). Replace alert with real form submission to send data to your server.');
      form.reset();
      photoPreview.style.display = 'none';
      photoInfo.textContent = 'No file chosen';
    });
  </script>
</body>
</html>
